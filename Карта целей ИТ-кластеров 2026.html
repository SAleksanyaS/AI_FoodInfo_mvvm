 $('#category-tabs').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{state.category=b.dataset.category;renderGoals()}));
 $('#result-count').textContent=`${visible.length} ${num(visible.length,'цель','цели','целей')} · ${state.status==='removed'?'архив':state.status==='check'?'с вопросами к данным':'цели и контрольные показатели'}`;
 $('#reset-filters').hidden=!(state.query||state.category!=='all'||state.status!=='current'||state.team!=='all');
 $('#goals').innerHTML=visible.length?visible.map(renderGoal).join(''):`<div class="empty"><strong>По этим фильтрам целей нет</strong><p>Измените направление, команду или режим. Неподтвержденные АС можно найти через «АС не сопоставлены».</p></div>`;
}
function renderGoal({a,g}){
 const m=METRICS[g.id]||[g.metric,'целевой результат'];let badge='';
 if(g.status==='clarify')badge='<span class="status-badge">Показатель уточняется</span>';
 if(g.status==='monitor')badge='<span class="status-badge monitor">Мониторинг</span>';
 if(g.status==='removed')badge='<span class="status-badge removed">Снята на 2H 2026</span>';
 const uncertain=needsCheck({a,g})&&g.status!=='clarify';if(uncertain&&g.status!=='removed')badge+='<span class="status-badge">Подтвердить применимость</span>';
 const kind={all:'Все команды кластера',direct:'Конкретные участники',conditional:'По применимости',confirm:'АС нужно подтвердить'}[a.confidence]||'Участники';
 const showNote=a.confidence!=='all'||g.status==='clarify';
 const legacy=a.legacySystems?.length?`<p><b>АС в PDF:</b> ${a.legacySystems.map(esc).join('; ')}.</p>`:'';
 const notes=g.notes?.length?`<ul>${g.notes.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`:'';
 const safeLinks=(g.links||[]).filter(l=>/^https:\/\//.test(l.url));
 return `<article class="goal ${g.status==='removed'?'removed-goal':''}" id="goal-${g.id}"><div class="goal-top"><div><div class="goal-meta"><span class="goal-id">${esc(g.id)}</span><span class="category-badge">${esc(CATEGORIES[g.category].long)}</span>${badge}</div><h2>${esc(g.title)}</h2><p class="goal-summary">${esc(g.summary)}</p></div><div class="metric"><b>${esc(m[0])}</b><span>${esc(m[1])}</span></div></div>
 <div class="goal-body"><div class="target"><span class="micro-label">${g.id==='IZT26'?'Годовой показатель':g.status==='removed'?'Решение по цели':'Какой результат нужен'}</span>${esc(g.target)}</div><div class="actions"><span class="micro-label">${g.status==='removed'?'Как учитывать':'Что организовать'}</span><ol>${g.actions.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></div></div>
 <div class="scope"><div class="scope-head"><span class="micro-label">Участники под управлением лидера</span><span class="scope-kind">${esc(kind)}</span></div>${a.teams.length?`<div class="chips">${a.teams.map(t=>chip(t)).join('')}${(a.candidateTeams||[]).map(t=>chip(t,true)).join('')}</div>`:`<div class="unknown-scope">Текущие команды не сопоставлены с АС из PDF. Сначала подтвердите зону участия.${a.legacySystems?.length?`<br><b>В источнике:</b> ${a.legacySystems.map(esc).join('; ')}`:''}</div>`}${showNote?`<p class="scope-note ${a.confidence==='conditional'&&!uncertain?'conditional':''}">${esc(a.note)}</p>`:''}</div>
 <div class="goal-bottom"><div class="goal-links">${safeLinks.length?safeLinks.map(l=>`<a class="resource-link" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${icon(l.kind==='method'?'book':'chart')}${esc(l.label)}${icon('external')}</a>`).join(''):'<span class="no-links">Ссылки на контроль в источнике не заполнены</span>'}</div><details class="source-details"><summary>Источник · PDF, стр. ${g.sourcePages.join(', ')} ⌄</summary><p><b>Формулировка в источнике:</b> ${esc(g.target)}</p>${legacy}${notes}<p>Названия текущих команд — из TXT.</p></details></div></article>`;
}
function sourceContent(){
 return `<p style="font-size:13px;line-height:1.8;color:#63755f">Карта связывает цели из PDF с руководителями и текущими командами из TXT. Это навигатор по обязательствам и источникам контроля.</p><section class="source-section"><h3>Два исходных документа</h3><div class="file-row"><b>гудит.pdf</b><small>9 страниц · «Дашборды ЦЕЛИ 2Н 2026» · отметка К3</small></div><div class="file-row"><b>команды по лидерам кластеров (3).txt</b><small>8 руководителей · 24 текущие команды и продукта</small></div><p>В HTML включено содержание и ссылки; исходные файлы и доступ к корпоративным системам отдельно не требуются для просмотра карты.</p></section>
 <section class="source-section"><h3>Что означают числа</h3><p>В PDF — 29 целей: 24 с формулировкой результата, 2 с неуточненными показателями, 2 в режиме мониторинга и 1 снятая. На главной 26 рабочих целей — это 24 + 2 с уточнением. Количество целей лидера зависит от применимости.</p><p>Фактические проценты выполнения не предоставлены. Числа в карточках показывают требуемый результат; актуальный факт смотрите по ссылкам контроля.</p></section>
 <section class="source-section"><h3>Как назначены участники</h3><ul><li><b>Все команды кластера</b> — в PDF указано «все АС» или «все продукты»; список раскрыт по TXT.</li><li><b>Конкретные участники</b> — найдена связь с названными в PDF АС. SAM соотнесен с Software Asset Management, T.Reports&Analytics — с TReports.</li><li><b>По применимости</b> — участвуют АС с соответствующей деятельностью: новые АС, ИИ-агенты, API, оферты или загрузки в КАП. Перечень фактических участников нужно проверить.</li><li><b>Подтвердить применимость / знак ?</b> — старое название АС не совпадает с текущей командой либо назначение спорно. Такой участник не считается подтвержденным.</li></ul></section>
 <section class="source-section"><h3>Что требует внимания</h3><ul><li>Связь QuickSolutions с «Пользовательскими вычислениями» и SmartSupport с Sber AssisT не подтверждена документами.</li><li>AI HUB OPS не распределена между текущими командами Андреева. Прежние АС Жуковой не сопоставлены с Inventory Management.</li><li>У AR26.3 рядом с Жуковой стоит «-?». Для ИТЗ/ИЗТР в кратких списках расходятся инициалы; у SD08.12 Жукова отсутствует в перечне руководителей при общем охвате АС с загрузками.</li><li>У SW26.4 среди руководителей есть Вольнова, но конкретная АС в строке — TReports Канаева. Цель назначена T.Reports&Analytics; участие Вольновой требует отдельного подтверждения.</li><li>SW26.11 и SW26.12 имеют TBD. Точное целевое значение GenAI-native score и ИТЗ нужно смотреть в методиках для подразделения.</li></ul></section>
 <section class="source-section"><h3>Какая версия целей взята</h3><p>Использованы итоговые формулировки Q4 и последние корректировки в PDF: рост story +50%, подготовка источников 20 рабочих дней, T2Data 26/18 дней. Старые значения не выданы за действующие.</p><p>IZT26 — годовой мониторинг без отдельной цели Q4. SD52.11 — мониторинг E2E 72/64 дня. UK26 снята на второе полугодие и показана в архиве; 82% из PDF — интегральный показатель по Банку, не результат кластера.</p></section>
 <section class="source-section"><h3>Ссылки и автономная работа</h3><p>Сохранены 34 реальные ссылки из текста и кликабельных областей PDF. Где ссылки не было, кнопка не создана. Ссылки не проверялись внутри корпоративной сети. Для перехода может потребоваться корпоративная авторизация.</p><p>Страница работает без установки, сервера, внешних шрифтов и библиотек. Ее можно передать одним HTML-файлом. Печать сохраняет текущую страницу и выбранные фильтры.</p></section>`;
}
function openSources(trigger){lastModalFocus=trigger||document.activeElement;$('#source-content').innerHTML=sourceContent();$('#source-overlay').hidden=false;document.body.style.overflow='hidden';$('#close-sources').focus()}
function closeSources(){if($('#source-overlay').hidden)return;$('#source-overlay').hidden=true;document.body.style.overflow='';lastModalFocus?.focus()}
function closeMenu(){$('#rail').classList.remove('open');$('#mobile-shade').classList.remove('open');$('#mobile-menu').setAttribute('aria-expanded','false')}
function route(){
 const match=location.hash.match(/^#\/leader\/([a-z]+)$/),id=match?.[1];
 if(id&&DATA.leaders[id])renderLeader(id);else renderHome();
 $('#nav-overview').classList.toggle('active',!currentLeader);$('#nav-overview').toggleAttribute('aria-current',!currentLeader);
 document.querySelectorAll('[data-leader-nav]').forEach(el=>{const active=el.dataset.leaderNav===currentLeader;el.classList.toggle('active',active);if(active)el.setAttribute('aria-current','page');else el.removeAttribute('aria-current')});closeMenu();window.scrollTo(0,0);
}
document.addEventListener('click',e=>{const skip=e.target.closest('.skip');if(skip){e.preventDefault();$('#main').focus();$('#main').scrollIntoView({block:'start'});return}const b=e.target.closest('[data-sources]');if(b)openSources(b)});
$('#close-sources').addEventListener('click',closeSources);$('#source-overlay').addEventListener('click',e=>{if(e.target===$('#source-overlay'))closeSources()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSources();closeMenu()}if(e.key==='Tab'&&!$('#source-overlay').hidden){const els=[...$('#source-overlay').querySelectorAll('button,a[href],input,select,[tabindex="0"]')],first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
$('#mobile-menu').addEventListener('click',()=>{const open=!$('#rail').classList.contains('open');$('#rail').classList.toggle('open',open);$('#mobile-shade').classList.toggle('open',open);$('#mobile-menu').setAttribute('aria-expanded',String(open))});$('#mobile-shade').addEventListener('click',closeMenu);$('#print').addEventListener('click',()=>window.print());window.addEventListener('hashchange',route);mountNavigation();route();
</script>
</body>
</html>
